name: Build and Release The Hive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      new_version: ${{ steps.check.outputs.new_version }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check version
        id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            NEW_VERSION=$(grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            VERSION_CODE=$(grep -m1 -oP '^\s*versionCode\s*=\s*\K\d+' app/build.gradle.kts)
            echo "version_changed=true"
            echo "new_version=$NEW_VERSION"
            echo "version_code=$VERSION_CODE"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            exit 0
          fi
          NEW_VERSION=$(grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
          OLD_VERSION=$(git show HEAD^:app/build.gradle.kts 2>/dev/null | grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' || echo "")
          if [ -z "$NEW_VERSION" ]; then echo "version_changed=false" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            VERSION_CODE=$(grep -m1 -oP '^\s*versionCode\s*=\s*\K\d+' app/build.gradle.kts)
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (foss)
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary
        env:
          PULL_REQUEST: "false"

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Rename signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          SIGNED_APK=$(find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*release-signed.apk" | head -1)
          if [ -z "$SIGNED_APK" ]; then
            echo "No signed APK found"
            ls -la "$OUTPUT_DIR"
            exit 1
          fi
          mkdir -p "$OUTPUT_DIR/out"
          cp "$SIGNED_APK" "$OUTPUT_DIR/out/The-Hive-v${{ needs.check-version.outputs.new_version }}.apk"
          ls -la "$OUTPUT_DIR/out/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: The-Hive-APK
          path: app/build/outputs/apk/foss/release/out/*.apk

  create-release:
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: The-Hive-APK
          path: release_files/

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          echo "Creating release v$VERSION"
          {
            echo "The Hive v$VERSION"
            echo ""
            echo "Built from Metrolist fork. Sideload only."
          } > release_notes.md
          gh release create "v$VERSION" \
            --title "The Hive $VERSION" \
            --notes-file release_notes.md \
            --latest \
            release_files/*.apk
          echo "Release created"