name: Nightly Debug APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "README.md"
      - "changelog.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The debug build type needs a keystore. Prefer the project's real signing
      # key (stable identity: nightlies can replace each other and the release
      # build without uninstalling first). Fall back to an ephemeral keytool
      # keystore when the secrets are not configured yet.
      - name: Provide debug signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using project keystore for debug signing"
            echo "$KEYSTORE_B64" | base64 -d > ./app/workflow-debug.keystore
            echo "HIVE_USE_PROJECT_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE secret; generating ephemeral debug keystore"
            keytool -genkeypair -v -keystore ./app/persistent-debug.keystore \
              -storetype PKCS12 -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=The Hive,C=IN"
            echo "HIVE_USE_PROJECT_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build Debug APK (foss)
        run: ./gradlew --console=plain assembleFossDebug --warning-mode summary
        env:
          PULL_REQUEST: "false"
          METROLIST_APPLICATION_ID: com.lordjinesh.thehive
          METROLIST_APP_NAME: The Hive
          METROLIST_DEBUG_KEYSTORE_PATH: ${{ env.HIVE_USE_PROJECT_KEYSTORE == 'true' && 'workflow-debug.keystore' || '' }}
          METROLIST_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          METROLIST_DEBUG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          METROLIST_DEBUG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename debug APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/debug"
          mkdir -p "$OUTPUT_DIR/out"
          APK=$(find "$OUTPUT_DIR" -name "*.apk" | head -1)
          cp "$APK" "$OUTPUT_DIR/out/The-Hive-debug-${GITHUB_SHA::7}.apk"
          ls -la "$OUTPUT_DIR/out/"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: The-Hive-debug
          path: app/build/outputs/apk/foss/debug/out/*.apk
          retention-days: 14